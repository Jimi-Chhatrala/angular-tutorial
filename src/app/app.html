<h1>{{ count() }}</h1>
<h1>{{ name() }}</h1>

<button (click)="setCount()">Set Count</button>

<hr />

<h2>{{ count1() }}</h2>
<h2>{{ doubleCount() }}</h2>

<button (click)="increment()">Increment</button>

<hr />

<h1>{{ unit() }}</h1>
<h1>{{ price() }}</h1>
<h1>{{ total() }}</h1>

<button (click)="updateUnit()">Unit ++</button>
<button (click)="updatePrice()">Price ++</button>
