<h2>Counter App</h2>

<p>Counter value: {{ counterStore.count() }}</p>

<button (click)="counterStore.increment()">Plus</button>
<button (click)="counterStore.decrement()">Minus</button>
<button (click)="counterStore.reset()">Reset</button>

<hr />

<h2>Web Login</h2>

@if (userStore.user()) {
  <p>Welcome {{ userStore.user()!.name }}</p>
  @if (userStore.isAdmin()) {
    <p>Admin Access!</p>
  }
  <button (click)="userStore.logout()">Logout</button>
} @else {
  <button (click)="userStore.login('John', 'admin')">Login as Admin</button>
}
