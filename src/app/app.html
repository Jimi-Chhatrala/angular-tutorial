<h1>User Form for creating user using JSON Server API</h1>
<input
  type="text"
  placeholder="Enter name"
  [value]="name()"
  (input)="name.set($event.target.value)"
/>

<input
  type="email"
  placeholder="Enter email"
  [value]="email()"
  (input)="email.set($event.target.value)"
/>

<button (click)="submitForm()">Add user</button>

<hr />
<h2>Users List From JSON Server GET API</h2>

<ul>
  @for (user of users(); track user.id) {
    <li>{{ user.name }} - {{ user.email }} - Is Active: {{ user.isActive ? 'Yes' : 'No' }}</li>
  }
</ul>
