<h1>NgRx with Forms</h1>

@if (form$ | async; as form) {
  <input
    type="text"
    placeholder="Enter Name"
    [value]="form.name"
    (input)="updatedField('name', $event.target.value)"
  />

  <br /><br />

  <input
    type="email"
    placeholder="Enter Email"
    [value]="form.email"
    (input)="updatedField('email', $event.target.value)"
  />
  <br /><br />

  <button (click)="resetForm()">Reset Form</button>
  <hr />
  <h4>Form Preview</h4>
  <pre>{{ form | json }}</pre>
}
