<input type="text" name="name" id="name" [(ngModel)]="name" placeholder="Enter name" />

<h2>{{ name }}</h2>

<hr />

<input
  type="text"
  name="username"
  id="username"
  [value]="username()"
  (input)="username.set($event.target.value)"
  placeholder="Enter username"
/>

<h3>{{ username() }}</h3>

<hr />

<input
  type="text"
  name="name"
  id="name"
  [value]="userData().name"
  (input)="updateName($event.target.value)"
  placeholder="Enter a name"
/>

<br /><br />
<h4>Updated a name: {{ userData().name }}</h4>
<h5>Age: {{ userData().age }}</h5>

<button (click)="updateAge(2)">Increate age</button>
