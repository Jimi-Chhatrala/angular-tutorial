<h2>Template Driven Form + Signal</h2>

<input
  type="text"
  name="name"
  id="name"
  [(ngModel)]="name"
  (ngModelChange)="name.set($event)"
  placeholder="Enter name"
/>

<br /><br />

<input
  type="text"
  name="email"
  id="email"
  [(ngModel)]="email"
  (ngModelChange)="email.set($event)"
  placeholder="Enter email"
/>

<br /><br />
<button (click)="submitForm()">Submit</button>

<p>Name: {{ name() }}</p>
<p>Email: {{ email() }}</p>

<hr />

<h2>Signal Reactive Form</h2>

<form [formGroup]="form">
  <input type="text" name="name" id="name" formControlName="name" placeholder="Enter a name" />

  <br /><br />
  <input type="text" name="email" id="email" formControlName="email" placeholder="Enter a email" />
  <br /><br />
</form>

<button (click)="submitFormData()">Submit Form Data</button>

<p>Name: {{ form.get('name')?.value }}</p>
<p>Email: {{ form.get('email')?.value }}</p>

<p>Signal Value:</p>
<pre>{{ userSignal() | json }}</pre>
